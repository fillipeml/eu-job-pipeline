[project]
name = "eu-job-pipeline"
version = "0.1.0"
description = "Multi-source job ingestion and LLM fit-scoring pipeline for a Europe relocation search"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fillipe Loose" }]
keywords = ["jobs", "pipeline", "llm", "claude", "sqlite", "europe"]
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "faker>=30",
]

[project.scripts]
eu-jobs = "eu_job_pipeline.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_job_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # the formatter wraps code at 100; long string literals may reach 120
